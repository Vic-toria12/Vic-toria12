<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2a40" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- binary streams -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#00ff9c" opacity="0.10">
    <text x="640" y="40">01001000 01100001 01100011 01101011 00100000 01100101</text>
    <text x="700" y="70">10110010 01010101 11001010 00110101 01001101</text>
    <text x="620" y="360">01110011 01100101 01100011 01110101 01110010 01100101</text>
    <text x="760" y="385">00101110 11010100 01010011 10100110</text>
  </g>

  <!-- network architecture (right) -->
  <g stroke="#00e5ff" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M1020 200 L880 110 L760 150"/>
    <path d="M1020 200 L900 290 L770 260"/>
    <path d="M1020 200 L1170 120 L1240 70"/>
    <path d="M1020 200 L1180 290 L1250 340"/>
    <path d="M880 110 L900 290"/>
    <path d="M1170 120 L1180 290"/>
    <path d="M760 150 L770 260"/>
  </g>
  <g fill="#0a1220" stroke="#00e5ff" stroke-width="1.5" opacity="0.8">
    <circle cx="880" cy="110" r="6"/><circle cx="760" cy="150" r="5"/>
    <circle cx="900" cy="290" r="6"/><circle cx="770" cy="260" r="5"/>
    <circle cx="1170" cy="120" r="6"/><circle cx="1240" cy="70" r="4"/>
    <circle cx="1180" cy="290" r="6"/><circle cx="1250" cy="340" r="4"/>
  </g>
  <!-- circuit traces -->
  <g stroke="#00ff9c" stroke-width="1.2" fill="none" opacity="0.28">
    <path d="M1100 60 H1160 L1190 30 H1280"/>
    <path d="M1110 350 H1170 L1200 380 H1280"/>
    <path d="M700 200 H740 L760 180"/>
  </g>
  <g fill="#00ff9c" opacity="0.5">
    <circle cx="1100" cy="60" r="3"/><circle cx="1110" cy="350" r="3"/><circle cx="700" cy="200" r="3"/>
  </g>

  <!-- shield + lock -->
  <circle cx="1020" cy="200" r="118" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.18"/>
  <circle cx="1020" cy="200" r="96" fill="none" stroke="#00ff9c" stroke-width="1" stroke-dasharray="3 7" opacity="0.28"/>
  <path d="M1020 120 L1080 144 V210 C1080 252 1050 278 1020 292 C990 278 960 252 960 210 V144 Z"
        fill="#0b1626" stroke="#00ff9c" stroke-width="2.5"/>
  <rect x="1002" y="200" width="36" height="28" rx="4" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
  <path d="M1009 200 V190 a11 11 0 0 1 22 0 V200" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
  <circle cx="1020" cy="213" r="3.5" fill="#00e5ff"/>

  <!-- left fade for text readability -->
  <rect width="900" height="400" fill="url(#fadeL)"/>

  <!-- text -->
  <g font-family="'JetBrains Mono','Space Grotesk','Courier New',monospace">
    <text x="100" y="118" font-size="20" fill="#00ff9c" opacity="0.9">&gt; whoami</text>
    <text x="98" y="205" font-size="88" font-weight="700" fill="#f2f6fb" letter-spacing="1">Victoria</text>
    <rect x="100" y="228" width="90" height="3" fill="#00ff9c"/>
    <text x="100" y="272" font-size="22" font-weight="600" fill="#e6edf6">Cybersecurity Analyst<tspan fill="#00ff9c">  |  </tspan>Ethical Hacker<tspan fill="#00ff9c">  |  </tspan>Tech Educator</text>
    <text x="100" y="308" font-size="17" fill="#7fe9ff" opacity="0.9">Empowering Africa through technology and cybersecurity</text>
  </g>
</svg>
